[pytest]
# Works from the repository root (pytest module_5 -m "...") and from module_5 itself
# (pytest -m "..."). Each run measures whichever of the two --cov paths exists, and the
# other one is reported by coverage as "Module ... was never imported", which is
# expected and harmless.
addopts = -q --cov=module_5/src --cov=src --cov-report=term-missing --cov-fail-under=100
pythonpath = src
testpaths = tests
markers =
    web: Flask route/page tests
    buttons: "Pull Data" and "Update Analysis" behavior
    analysis: formatting/rounding of analysis output
    db: database schema/inserts/selects
    integration: end-to-end flows
