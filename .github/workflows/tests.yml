# Module 4 CI: start PostgreSQL, install module_4's requirements, and run the full
# marked pytest suite with the 100% coverage gate from module_4/pytest.ini.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres       # throwaway credentials for the CI container only
          POSTGRES_DB: gradcafe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gradcafe_test

    defaults:
      run:
        working-directory: module_4

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_4/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run the test suite with coverage
        run: pytest -m "web or buttons or analysis or db or integration"
