# Module 5 CI: "shift-left" software assurance. Four separate jobs run on every push and
# pull request, so a lint, graph, supply-chain or test failure is visible on its own:
#
#   pylint            -> the code must score 10.00/10 (fails below 10)
#   dependency-graph  -> pydeps + Graphviz must produce a non-empty dependency.svg
#   snyk              -> `snyk test` scans the pinned dependencies for known vulnerabilities
#   pytest            -> the full suite, with the 100% coverage gate, against real PostgreSQL
#
# (Module 4's own workflow, tests.yml, keeps running for module_4/.)
name: module_5 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pylint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: module_5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install the pinned dependencies and the project
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Pylint (the build fails if the score is below 10)
        run: pylint src --fail-under=10

  dependency-graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: module_5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install Graphviz (provides the `dot` command pydeps needs)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install the pinned dependencies and the project
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Generate dependency.svg
        run: |
          rm -f dependency.svg
          pydeps src/flask_app.py --noshow -T svg -o dependency.svg --max-module-depth=1

      - name: Fail if dependency.svg is missing or empty
        run: test -s dependency.svg

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-graph
          path: module_5/dependency.svg

  snyk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: module_5
    env:
      # Add this under Settings > Secrets and variables > Actions. Never paste a token here.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Snyk's Python plugin reads the installed packages, so install them first.
      - name: Install the pinned dependencies
        run: python -m pip install -r requirements.txt

      - name: Install the Snyk CLI
        run: npm install -g snyk

      - name: Snyk dependency scan (fails on high or critical vulnerabilities)
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk test --file=requirements.txt --package-manager=pip --severity-threshold=high

      - name: Snyk was skipped (no SNYK_TOKEN secret on this repository or pull request)
        if: ${{ env.SNYK_TOKEN == '' }}
        run: echo "::warning::SNYK_TOKEN is not set, so the Snyk scan did not run."

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres        # throwaway superuser for this CI container only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Throwaway passwords for the two roles created inside the CI container below.
      DB_OWNER_PASSWORD: ci-owner-password
      DB_PASSWORD: ci-app-password
      TEST_DATABASE_URL: postgresql://gradcafe_m5_owner:ci-owner-password@localhost:5432/gradcafe_m5_test
      TEST_APP_DATABASE_URL: postgresql://gradcafe_m5_app:ci-app-password@localhost:5432/gradcafe_m5_test
      DATABASE_URL: postgresql://gradcafe_m5_app:ci-app-password@localhost:5432/gradcafe_m5

    defaults:
      run:
        working-directory: module_5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: module_5/requirements.txt

      - name: Install the pinned dependencies and the project
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Create the least-privilege roles, databases and table (src/db_setup.sql)
        working-directory: module_5/src
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db_setup.sql

      - name: Run the test suite with coverage
        run: pytest -m "web or buttons or analysis or db or integration"
