<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Site{% endblock %} · Caleb Gevertz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <a href="{{ url_for('main.home') }}" class="brand">Caleb Gevertz</a>
        <div class="nav-links">
            <a href="{{ url_for('main.home') }}"
               class="nav-link {% if active_page == 'home' %}active{% endif %}">Home</a>
            <a href="{{ url_for('main.projects') }}"
               class="nav-link {% if active_page == 'projects' %}active{% endif %}">Projects</a>
            <a href="{{ url_for('main.contact') }}"
               class="nav-link {% if active_page == 'contact' %}active{% endif %}">Contact</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Caleb Gevertz &middot; Built with Flask</p>
    </footer>

</body>
</html>
